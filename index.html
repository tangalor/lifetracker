<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticazione Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="languages.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 14px 20px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        .tab:first-child {
            border-right: 1px solid #e0e0e0;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab:not(.active):hover {
            background: #f8f9fa;
        }

        .tab-icon {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input.error {
            border-color: #dc3545;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .field-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .field-error.show {
            display: block;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .form-container {
            min-height: 380px;
            position: relative;
        }

        form {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        form.hidden {
            opacity: 0;
            pointer-events: none;
        }

        form:not(.hidden) {
            opacity: 1;
            pointer-events: auto;
        }

        .dashboard {
            text-align: center;
        }

        .dashboard h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .dashboard p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
            font-size: 14px;
        }

        .logout-btn {
            background: #dc3545;
            width: auto;
            padding: 12px 30px;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .tab {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="authSection">
            <h1 id="welcomeTitle"></h1>
            
            <div class="error" id="errorMessage"></div>
            <div class="success" id="successMessage"></div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">
                    <span class="tab-icon">🔑</span>
                    <span id="loginTab"></span>
                </button>
                <button class="tab" onclick="switchTab('register')">
                    <span class="tab-icon">✨</span>
                    <span id="registerTab"></span>
                </button>
            </div>

            <div class="form-container">
                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail" id="loginEmailLabel"></label>
                        <input type="email" id="loginEmail">
                        <div class="field-error" id="loginEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword" id="loginPasswordLabel"></label>
                        <input type="password" id="loginPassword">
                        <div class="field-error" id="loginPasswordError"></div>
                    </div>
                    <button type="submit" id="loginSubmitBtn"></button>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="hidden">
                    <div class="form-group">
                        <label for="registerEmail" id="registerEmailLabel"></label>
                        <input type="email" id="registerEmail">
                        <div class="field-error" id="registerEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword" id="registerPasswordLabel"></label>
                        <input type="password" id="registerPassword">
                        <div class="field-error" id="registerPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label for="registerPasswordConfirm" id="registerPasswordConfirmLabel"></label>
                        <input type="password" id="registerPasswordConfirm">
                        <div class="field-error" id="registerPasswordConfirmError"></div>
                    </div>
                    <button type="submit" id="registerSubmitBtn"></button>
                </form>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden dashboard">
            <h2 id="dashboardTitle"></h2>
            <div class="user-info" id="userInfo"></div>
            <p id="dashboardText"></p>
            <button class="logout-btn" onclick="logout()" id="logoutBtn"></button>
        </div>
    </div>

    <script>
        // Inizializza Supabase
        const SUPABASE_URL = 'https://wyhtzfglpqrwptbampee.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5aHR6ZmdscHFyd3B0YmFtcGVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMTM3MDgsImV4cCI6MjA4MjU4OTcwOH0.vMLEhib0IAW55snT4dVr-NYyO145VRxK6aREtmgJcSU';
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Initialize translations
        function initTranslations() {
            document.getElementById('welcomeTitle').textContent = t.welcome;
            document.getElementById('loginTab').textContent = t.login;
            document.getElementById('registerTab').textContent = t.register;
            
            // Login form
            document.getElementById('loginEmailLabel').textContent = t.email;
            document.getElementById('loginPasswordLabel').textContent = t.password;
            document.getElementById('loginEmail').placeholder = t.emailPlaceholder;
            document.getElementById('loginPassword').placeholder = t.passwordPlaceholder;
            document.getElementById('loginSubmitBtn').textContent = t.loginButton;
            
            // Register form
            document.getElementById('registerEmailLabel').textContent = t.email;
            document.getElementById('registerPasswordLabel').textContent = t.password;
            document.getElementById('registerPasswordConfirmLabel').textContent = t.confirmPassword;
            document.getElementById('registerEmail').placeholder = t.emailPlaceholder;
            document.getElementById('registerPassword').placeholder = t.passwordPlaceholder;
            document.getElementById('registerPasswordConfirm').placeholder = t.passwordPlaceholder;
            document.getElementById('registerSubmitBtn').textContent = t.registerButton;
            
            // Dashboard
            document.getElementById('dashboardTitle').textContent = t.dashboardTitle;
            document.getElementById('dashboardText').textContent = t.dashboardText;
            document.getElementById('logoutBtn').textContent = t.logout;
        }

        // Elements
        const authSection = document.getElementById('authSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const userInfo = document.getElementById('userInfo');

        // Switch between login and register tabs
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            hideMessages();
            hideAllFieldErrors();
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        // Hide messages
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Show field error
        function showFieldError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
                inputElement.classList.add('error');
            }
        }

        // Hide field error
        function hideFieldError(fieldId) {
            const errorElement = document.getElementById(fieldId + 'Error');
            const inputElement = document.getElementById(fieldId);
            if (errorElement && inputElement) {
                errorElement.classList.remove('show');
                inputElement.classList.remove('error');
            }
        }

        // Hide all field errors
        function hideAllFieldErrors() {
            const errorElements = document.querySelectorAll('.field-error');
            const inputElements = document.querySelectorAll('input');
            errorElements.forEach(el => el.classList.remove('show'));
            inputElements.forEach(el => el.classList.remove('error'));
        }

        // Login handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            hideAllFieldErrors();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Validation
            let hasError = false;
            if (!email) {
                showFieldError('loginEmail', currentLang === 'it' ? 'Email richiesta' : 'Email required');
                hasError = true;
            }
            if (!password) {
                showFieldError('loginPassword', currentLang === 'it' ? 'Password richiesta' : 'Password required');
                hasError = true;
            }
            if (hasError) return;
            
            const btn = loginForm.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = t.loggingIn;
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) throw error;
                
                showSuccess(t.loginSuccess);
                setTimeout(() => {
                    showDashboard(data.user);
                }, 500);
                
            } catch (error) {
                showError(error.message || 'Errore durante il login');
            } finally {
                btn.disabled = false;
                btn.textContent = t.loginButton;
            }
        });

        // Register handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            hideAllFieldErrors();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerPasswordConfirm').value;
            
            // Validation
            let hasError = false;
            if (!email) {
                showFieldError('registerEmail', currentLang === 'it' ? 'Email richiesta' : 'Email required');
                hasError = true;
            }
            if (!password) {
                showFieldError('registerPassword', currentLang === 'it' ? 'Password richiesta' : 'Password required');
                hasError = true;
            } else if (password.length < 6) {
                showFieldError('registerPassword', currentLang === 'it' ? 'Minimo 6 caratteri' : 'Minimum 6 characters');
                hasError = true;
            }
            if (!confirmPassword) {
                showFieldError('registerPasswordConfirm', currentLang === 'it' ? 'Conferma password richiesta' : 'Password confirmation required');
                hasError = true;
            } else if (password !== confirmPassword) {
                showFieldError('registerPasswordConfirm', t.passwordMismatch);
                hasError = true;
            }
            if (hasError) return;
            
            const btn = registerForm.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = t.registering;
            
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password
                });
                
                if (error) throw error;
                
                showSuccess(t.registerSuccess);
                registerForm.reset();
                
                // Se la conferma email è disabilitata, l'utente sarà loggato automaticamente
                if (data.user && data.session) {
                    setTimeout(() => {
                        showDashboard(data.user);
                    }, 1500);
                }
                
            } catch (error) {
                showError(error.message || 'Errore durante la registrazione');
            } finally {
                btn.disabled = false;
                btn.textContent = t.registerButton;
            }
        });

        // Show dashboard
        function showDashboard(user) {
            authSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            userInfo.innerHTML = `<strong>${t.userEmail}</strong> ${user.email}`;
        }

        // Show auth
        function showAuth() {
            authSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
            loginForm.reset();
            registerForm.reset();
            hideMessages();
        }

        // Logout
        async function logout() {
            try {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
                showAuth();
            } catch (error) {
                alert(t.logoutError + error.message);
            }
        }

        // Check initial session
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session && session.user) {
                showDashboard(session.user);
            } else {
                showAuth();
            }
        }

        // Listen for auth changes
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                showDashboard(session.user);
            } else if (event === 'SIGNED_OUT') {
                showAuth();
            }
        });

        // Initialize
        initTranslations();
        checkSession();
    </script>
</body>
</html>
